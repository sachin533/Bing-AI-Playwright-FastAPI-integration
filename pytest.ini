[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio configuration
#
# The session scope for both the test loop and the fixture loop is required:
# Playwright's async objects are bound to the event loop that created them,
# so a module-scoped browser fixture must share the loop of the tests that
# use it.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

markers =
    integration: real browser / real network integration test (slow)
    mocked: unit test using mocks (no network, no browser)

addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
